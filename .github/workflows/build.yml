name: Build patched IntuneGet image

# Builds when upstream-ref, the patches or the branding change on main, then
# opens a "Deploy" PR that moves deploy/version to the new image. Building never
# changes the server; merging the Deploy PR does.

on:
  push:
    branches: [main]
    paths:
      - upstream-ref
      - patches/**
      - branding/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream ugurkocde/IntuneGet tag to build (blank uses upstream-ref)
        required: false

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/intuneget

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure; no stored secret
    outputs:
      tag: ${{ steps.rev.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out HRM patches
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: hrm
          persist-credentials: false

      - name: Choose the upstream tag
        # upstream-ref: the tag on the first line, the commit it pointed at when
        # it was reviewed on the second. A tag moved since then fails the build.
        id: ref
        env:
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          pinned=$(sed -n 1p hrm/upstream-ref | tr -d '[:space:]')
          ref="${INPUT_REF:-$pinned}"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not an upstream tag: '$ref'"; exit 1; }
          commit=""
          [ "$ref" != "$pinned" ] || commit=$(sed -n 2p hrm/upstream-ref | tr -d '[:space:]')
          [ -z "$commit" ] || [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a commit in upstream-ref: '$commit'"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out upstream
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ugurkocde/IntuneGet
          ref: ${{ steps.ref.outputs.ref }}
          path: upstream
          persist-credentials: false

      - name: Check the upstream tag hasn't moved
        if: steps.ref.outputs.commit != ''
        working-directory: upstream
        env:
          REF: ${{ steps.ref.outputs.ref }}
          COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$COMMIT" ] || { echo "::error::Upstream $REF now points at $head, not the reviewed $COMMIT. Review the change before building."; exit 1; }

      - name: Apply patches
        working-directory: upstream
        run: |
          for p in ../hrm/patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          git diff --stat

      - name: Apply HRM branding (logo + icons)
        working-directory: upstream
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          SRC=../hrm/branding/hrm-mark.svg
          cp "$SRC" public/favicon.svg
          for s in 16 32; do rsvg-convert -w $s -h $s "$SRC" -o public/favicon-${s}x${s}.png; done
          rsvg-convert -w 180 -h 180 -b white "$SRC" -o public/apple-touch-icon.png
          for s in 192 512; do rsvg-convert -w $s -h $s "$SRC" -o public/logo-$s.png; done
          rsvg-convert -w 48 -h 48 "$SRC" -o /tmp/f48.png
          convert public/favicon-16x16.png public/favicon-32x32.png /tmp/f48.png public/favicon.ico
          cp public/favicon.ico app/favicon.ico
          ls -la public/favicon* public/apple-touch-icon.png public/logo-*.png app/favicon.ico

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to Azure Container Registry
        # An Entra app with a federated credential for this repo's main branch
        # (AcrPush on the registry only); no stored secret. Uses the runner's
        # Azure CLI; the registry token is masked and lives only in this job.
        # Tokens go to curl on stdin, not as arguments.
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          oidc=$(printf 'Authorization: Bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | curl -fsS -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$oidc" --allow-no-subscriptions -o none
          aad=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          refresh=$(printf '%s' "$aad" | curl -fsS -X POST --data-urlencode grant_type=access_token --data-urlencode "service=$REGISTRY" --data-urlencode "tenant=$AZURE_TENANT_ID" --data-urlencode "access_token@-" "https://$REGISTRY/oauth2/exchange" | jq -r .refresh_token)
          echo "::add-mask::$refresh"
          printf '%s' "$refresh" | docker login "$REGISTRY" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          echo "ACR_REFRESH_TOKEN=$refresh" >> "$GITHUB_ENV"

      - name: Pick the next HRM revision
        # Tags are <upstream>-hrm.<n>; take one more than the highest n already
        # published, so a number is never reused after cleanup deletes old tags.
        id: rev
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          access=$(printf '%s' "$ACR_REFRESH_TOKEN" | curl -fsS -X POST --data-urlencode grant_type=refresh_token --data-urlencode "service=$REGISTRY" \
            --data-urlencode "scope=repository:intuneget:pull" --data-urlencode "refresh_token@-" \
            "https://$REGISTRY/oauth2/token" | jq -r .access_token)
          echo "::add-mask::$access"
          code=$(printf 'Authorization: Bearer %s\n' "$access" | curl -sS -o tags.json -w '%{http_code}' -H @- "https://$REGISTRY/v2/intuneget/tags/list?n=1000")
          case "$code" in
            200) ;;
            404) echo '{"tags":[]}' > tags.json ;; # first image for this app
            *) echo "::error::Could not list existing tags (HTTP $code)"; exit 1 ;;
          esac
          max=$(jq -r '.tags[]?' tags.json | sed -nE "s/^${REF//./\\.}-hrm\.([0-9]+)$/\1/p" | sort -n | tail -n 1)
          n=$(( ${max:-0} + 1 ))
          echo "tag=$REF-hrm.$n" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$REF-hrm.$n"

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: upstream
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.rev.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=IntuneGet ${{ steps.ref.outputs.ref }} with HRM patches (see patches/)
            org.opencontainers.image.version=${{ steps.rev.outputs.tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
            NEXT_PUBLIC_AZURE_AD_CLIENT_ID=placeholder

  propose-deploy:
    # Opens the PR that moves deploy/version. Merging it deploys to the VM.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      DIGEST: ${{ needs.build.outputs.digest }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Open the Deploy PR
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::The build gave no image digest: '$DIGEST'"; exit 1; }
          current=$(sed -n 1p deploy/version | tr -d '[:space:]')
          branch="deploy/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # The tag, then the digest: the VM refuses the tag if it no longer points at this image.
          printf '%s\n%s\n' "$TAG" "$DIGEST" > deploy/version
          git commit -am "Deploy $TAG"
          git push origin "$branch"
          cat > body.md <<EOF
          Moves the IntuneGet server from \`$current\` to \`$TAG\` (built in $RUN_URL). Image digest \`$DIGEST\`.

          **Merging this deploys to production.** Within about 5 minutes the VM backs up its data, switches the image and waits for it to report healthy. If it doesn't, the VM restores the backup and goes back to \`$current\`.

          Before merging:
          - [ ] IntuneGet-Workflows has the packaging workflow for this upstream version.

          After merging, check on the VM: \`sudo intuneget-deploy status\`
          EOF
          title="Deploy $TAG"
          if ! gh pr create --base main --head "$branch" --title "$title" --body-file body.md; then
            # The organization doesn't let Actions open PRs; leave a one-click link instead.
            url="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?quick_pull=1&title=$(jq -rn --arg s "$title" '$s|@uri')&body=$(jq -rn --rawfile s body.md '$s|@uri')"
            { echo "### Deploy PR not opened automatically"; echo; echo "[Create pull request]($url)"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Deploy PR not opened::Open it from the run summary: Create pull request."
          fi
